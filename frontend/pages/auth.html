<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication | Graph Fraud Detection</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body data-page="auth">
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-mark">GF</span>
      <span class="brand-text">
        <strong>Graph-Based Fraud Detection</strong>
        <small>Secure access</small>
      </span>
    </a>
    <nav class="nav-links" aria-label="Primary navigation">
      <button class="theme-toggle" type="button" data-theme-toggle>Light mode</button>
      <a href="/" class="nav-button">Overview</a>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-intro">
        <p class="eyebrow">Account workspace</p>
        <h1>Access the scanner.</h1>
        <p class="hero-copy">Use a user account for transaction monitoring or switch to admin access for system-wide analytics.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" type="button" data-target="loginForm">Sign in</button>
        <button class="auth-tab" type="button" data-target="registerForm">Create account</button>
      </div>

      <p id="authMessage" class="form-message" aria-live="polite"></p>

      <form id="loginForm" class="auth-form active">
        <div class="auth-heading-row">
          <h2 id="loginTitle">User login</h2>
          <button type="button" id="toggleAdminBtn" class="link-button">Log in as admin</button>
        </div>

        <input type="hidden" id="loginType" value="user">

        <div class="field-grid">
          <label>
            Username
            <input type="text" id="loginUsername" required placeholder="Enter your username">
          </label>
          <label>
            Password
            <input type="password" id="loginPassword" required placeholder="Enter your password">
          </label>
        </div>
        <button type="submit" class="primary-action">Sign in</button>
      </form>

      <form id="registerForm" class="auth-form">
        <div class="auth-heading-row">
          <h2>Register</h2>
        </div>
        <div class="field-grid">
          <label>
            Username
            <input type="text" id="regUsername" required minlength="3" placeholder="Choose a username">
          </label>
          <label>
            Password
            <input type="password" id="regPassword" required minlength="8" placeholder="Choose a password (8+ chars)">
          </label>
        </div>
        <button type="submit" class="primary-action">Create account</button>
      </form>
    </section>
  </main>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
